    <!--
      O mapa da seção de localização é montado com tiles do OpenStreetMap (ver
      src/components/Mapa.tsx). Abrir a conexão desde já economiza o DNS, o TCP
      e o TLS na hora em que os dezesseis tiles são pedidos de uma vez — e é o
      terceiro domínio mais caro do site, atrás só do YouTube e do Google, que
      só entram depois de um clique.
    -->
    <link rel="preconnect" href="https://tile.openstreetmap.org" crossorigin />

    <!--
      As fontes são self-hosted e só o subset latin é usado no primeiro texto
      pintado. Pré-carregá-las evita o salto de layout do fallback do sistema.
      Só duas entram aqui: o peso 600 do Sora (o <h1>) e o Inter variável (todo
      o corpo). Pré-carregar as demais competiria com elas pela banda.
    -->
    <link rel="preload" href="/fonts/sora-latin-600.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/inter-latin-300_700.woff2" as="font" type="font/woff2" crossorigin />
